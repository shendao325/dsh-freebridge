# FreeBridge bundle patch —— 把插件插入 profile 的层栈。
#
# 必须用 insert 语法：bundle 合并时新增插件条目，而不是覆盖一个不存在的已有条目。
# 默认配置全部内联，装完即用；高级用户可在 profile 自己的 cordis.patch.yml 里
# 按 id: freebridge 覆盖任意字段。
- insert:
    - id: freebridge
      name: 'dsh-freebridge'
      config:
        enabled: true

        # 匿名上游：主力 + 备用
        kilo:
          enabled: true
          weight: 20
        ovh:
          enabled: true
          weight: 6

        # 模块一：Token 用量统计
        ledger:
          enabled: true
          showAttemptLevel: false
          includeBranch: false

        # 模块二：按需网络分流
        routing:
          enabled: true
          probeTimeoutMs: 4000
          separateWebRoute: true
          followSystemProxy: true

        # 模块三：桌面操作编排
        desktop:
          enabled: true
          autoLaunch: true

        # 模块四：操作边界守门（默认开启）
        guard:
          enabled: true
          useAiReview: false

        # 状态与统计接口
        exposeHealth: true
